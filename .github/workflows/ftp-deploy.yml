name: Deploy HostGator FTP

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.census.inf.br
          username: github@blackink.cloud
          password: Acesso@24
          protocol: ftp
          local-dir: ./
          server-dir: 
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/README.md
            **/node_modules/**
