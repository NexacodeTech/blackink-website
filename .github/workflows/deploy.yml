# .github/workflows/deploy.yml
name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Ajuste para sua região

      - name: Remove existing files from S3
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET_FRONTEND }} --recursive

      - name: Upload to S3
        run: |
          # Upload CSS, JS e imagens com cache longo
          aws s3 sync ./ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore"
          
          # Upload HTML files com no-cache
          aws s3 sync ./ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          
          # Upload JSON files com no-cache (se houver)
          aws s3 sync ./ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --exclude "*" \
            --include "*.json" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment completed
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Files uploaded to S3: ${{ secrets.S3_BUCKET_FRONTEND }}"
          echo "🔄 CloudFront cache invalidated"
          echo "🔗 Commit: ${{ github.sha }}"
