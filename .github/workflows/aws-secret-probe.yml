name: Probe leftover AWS secrets

on:
  push:
    branches:
      - cursor/aws-secret-probe-a07b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether website AWS secrets still authenticate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          unset AWS_SESSION_TOKEN || true
          echo "secret AWS_ACCESS_KEY_ID present=$( [ -n "$AWS_ACCESS_KEY_ID" ] && echo yes || echo NO )"
          echo "secret AWS_SECRET_ACCESS_KEY present=$( [ -n "$AWS_SECRET_ACCESS_KEY" ] && echo yes || echo NO )"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "NO_WEBSITE_AWS_SECRETS"
            exit 0
          fi
          if aws sts get-caller-identity; then
            echo "WEBSITE_AWS_STS_OK"
            aws iam list-attached-user-policies --user-name "$(aws sts get-caller-identity --query Arn --output text | awk -F/ '{print $NF}')" || true
            aws deploy list-applications || true
          else
            echo "WEBSITE_AWS_STS_FAILED"
            exit 1
          fi
