<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackInk — Cloaker Server-Side</title>
    <meta name="description" content="Cloaker server-side para Google Ads — R$ 399,99/mês. Redirecionando para cadastro.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script>document.documentElement.setAttribute('data-locale-pending','1');setTimeout(function(){document.documentElement.removeAttribute('data-locale-pending');},800);</script>
    <style>html[data-locale-pending]{visibility:hidden}</style>
    <script src="/js/locale-redirect.js"></script>
    <script>if(!window.__blackinkLocaleRedirecting)document.documentElement.removeAttribute('data-locale-pending');</script>
    <script>
    (function() {
        if (window.__blackinkLocaleRedirecting) return;
        var params = new URLSearchParams(window.location.search);
        if (!params.has('plan')) params.set('plan', 'Maré');
        if (!params.has('period')) params.set('period', 'monthly');
        var ref = params.get('ref') || localStorage.getItem('blackink_referral_code');
        var fref = params.get('fref') || localStorage.getItem('blackink_friend_referral_code');
        if (ref && !params.has('ref')) params.set('ref', ref);
        if (fref && !params.has('fref')) params.set('fref', fref);
        window.location.replace('/cadastro/?' + params.toString());
    })();
    </script>
</head>
<body>
    <p style="font-family:system-ui,sans-serif;text-align:center;padding:48px;color:#888">Redirecionando para cadastro…</p>
    <script src="/js/referral-tracking.js"></script>
</body>
</html>
